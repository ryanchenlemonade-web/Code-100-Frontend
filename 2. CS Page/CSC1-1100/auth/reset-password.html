<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reset Password — CSCI-1100</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background: linear-gradient(135deg, hsl(207, 60%, 96%), hsl(260, 50%, 96%));
            display: flex;
            align-items: center;
            justify-content: center;
            height: 100vh;
            margin: 0;
        }
        .card {
            background: #ffffff;
            border-radius: 16px;
            padding: 40px 48px;
            box-shadow: 0 12px 40px rgba(0, 0, 0, 0.12);
            max-width: 400px;
            width: 90%;
            box-sizing: border-box;
        }
        h1 { margin-top: 0; text-align: center; }
        label { display: block; font-weight: 600; font-size: 0.9rem; margin-bottom: 6px; }
        input {
            width: 100%;
            padding: 10px 12px;
            border: 1px solid hsl(0, 0%, 87%);
            border-radius: 8px;
            font-size: 0.95rem;
            box-sizing: border-box;
            margin-bottom: 16px;
        }
        button {
            width: 100%;
            padding: 11px;
            border: none;
            border-radius: 10px;
            background: #0066cc;
            color: white;
            font-weight: 600;
            cursor: pointer;
        }
        .message {
            text-align: center;
            padding: 10px;
            border-radius: 8px;
            margin-bottom: 16px;
            font-size: 0.9rem;
        }
        .success { background: hsl(140, 40%, 94%); color: hsl(140, 45%, 28%); }
        .error { background: hsl(0, 70%, 96%); color: hsl(0, 70%, 40%); }
        .password-input-wrap { position: relative; }
        .password-input-wrap input { padding-right: 42px; }
        .toggle-password-btn {
            position: absolute;
            right: 8px;
            top: 8px;
            background: none;
            border: none;
            cursor: pointer;
            font-size: 1.05rem;
            padding: 4px 6px;
            line-height: 1;
            opacity: 0.7;
        }
        .toggle-password-btn:hover { opacity: 1; }
    </style>
</head>
<body>
    <div class="card">
        <h1>Set New Password</h1>
        <div id="message-area"></div>
        <form id="reset-form">
            <label for="new-password">New Password (6+ characters)</label>
            <div class="password-input-wrap">
                <input type="password" id="new-password" minlength="6" required>
                <button type="button" class="toggle-password-btn" id="toggle-new-password" aria-label="Show password">👁️</button>
            </div>
            <button type="submit">Reset Password</button>
        </form>
    </div>

    <script src="../../../0. Shared/config.js"></script>
    <script>
        const params = new URLSearchParams(window.location.search);
        const token = params.get('token');
        const messageArea = document.getElementById('message-area');
        const form = document.getElementById('reset-form');

        const newPasswordInput = document.getElementById('new-password');
        const toggleBtn = document.getElementById('toggle-new-password');
        toggleBtn.addEventListener('click', () => {
            const isHidden = newPasswordInput.type === 'password';
            newPasswordInput.type = isHidden ? 'text' : 'password';
            toggleBtn.textContent = isHidden ? '🙈' : '👁️';
        });

        if (!token) {
            messageArea.innerHTML = '<div class="message error">Missing reset token.</div>';
            form.style.display = 'none';
        }

        form.addEventListener('submit', (e) => {
            e.preventDefault();
            const newPassword = document.getElementById('new-password').value;

            fetch(`${APP_API_BASE}/api/auth/reset-password`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ token, newPassword })
            })
                .then(res => res.json().then(data => ({ ok: res.ok, data })))
                .then(({ ok, data }) => {
                    messageArea.innerHTML = `<div class="message ${ok ? 'success' : 'error'}">${data.message || data.error}</div>`;
                    if (ok) form.style.display = 'none';
                })
                .catch(() => {
                    messageArea.innerHTML = '<div class="message error">Something went wrong. Please try again later.</div>';
                });
        });
    </script>
</body>
</html>
