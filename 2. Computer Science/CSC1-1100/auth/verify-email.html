<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Verify Email — CSCI-1100</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background: linear-gradient(135deg, hsl(207, 60%, 96%), hsl(260, 50%, 96%));
            display: flex;
            align-items: center;
            justify-content: center;
            height: 100vh;
            margin: 0;
        }
        .card {
            background: #ffffff;
            border-radius: 16px;
            padding: 40px 48px;
            box-shadow: 0 12px 40px rgba(0, 0, 0, 0.12);
            text-align: center;
            max-width: 420px;
        }
        h1 { margin-top: 0; }
        .success { color: hsl(140, 45%, 28%); }
        .error { color: hsl(0, 70%, 40%); }
        .hint { color: #6b7280; font-size: 0.85rem; margin-top: 4px; }
        a.btn {
            display: inline-block;
            margin-top: 20px;
            padding: 10px 24px;
            background: #0066cc;
            color: white;
            border-radius: 10px;
            text-decoration: none;
            font-weight: 600;
        }
    </style>
</head>
<body>
    <div class="card">
        <h1>Email Verification</h1>
        <p id="status-message">Verifying...</p>
        <p id="close-hint" class="hint" style="display:none;">Check your other tab to log in, then close this one.</p>
        <a class="btn" id="go-to-site-btn" href="../../../1. Home Page/home_page.html">Go to site</a>
    </div>

    <script src="../../../0. Shared/config.js"></script>
    <script>
        const params = new URLSearchParams(window.location.search);
        const token = params.get('token');
        const statusEl = document.getElementById('status-message');
        const closeHintEl = document.getElementById('close-hint');

        if (!token) {
            statusEl.textContent = 'Missing verification token.';
            statusEl.className = 'error';
        } else {
            fetch(`${APP_API_BASE}/api/auth/verify-email?token=${encodeURIComponent(token)}`)
                .then(res => res.json().then(data => ({ ok: res.ok, data })))
                .then(({ ok, data }) => {
                    statusEl.textContent = data.message || data.error;
                    statusEl.className = ok ? 'success' : 'error';

                    if (ok) {
                        // 往 localStorage 写一个信号：同一个浏览器里，任何还开着的本站标签页
                        // （比如用户注册时那个标签页）都会收到 'storage' 事件，自动弹提示、
                        // 把登录框切到登录视图，不需要用户自己切回去手动操作。
                        // 用时间戳保证每次值都不一样，'storage' 事件才会触发（值没变不会触发）。
                        localStorage.setItem('email_verified_signal', String(Date.now()));

                        closeHintEl.style.display = 'block';
                    }
                })
                .catch(() => {
                    statusEl.textContent = 'Something went wrong. Please try again later.';
                    statusEl.className = 'error';
                });
        }
    </script>
</body>
</html>
