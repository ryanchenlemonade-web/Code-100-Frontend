<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Verify Email — CSCI-1100</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background: linear-gradient(135deg, hsl(207, 60%, 96%), hsl(260, 50%, 96%));
            display: flex;
            align-items: center;
            justify-content: center;
            height: 100vh;
            margin: 0;
        }
        .card {
            background: #ffffff;
            border-radius: 16px;
            padding: 40px 48px;
            box-shadow: 0 12px 40px rgba(0, 0, 0, 0.12);
            text-align: center;
            max-width: 420px;
        }
        h1 { margin-top: 0; }
        .success { color: hsl(140, 45%, 28%); }
        .error { color: hsl(0, 70%, 40%); }
        a.btn {
            display: inline-block;
            margin-top: 20px;
            padding: 10px 24px;
            background: #0066cc;
            color: white;
            border-radius: 10px;
            text-decoration: none;
            font-weight: 600;
        }
    </style>
</head>
<body>
    <div class="card">
        <h1>Email Verification</h1>
        <p id="status-message">Verifying...</p>
        <a class="btn" href="../index/cs1_index.html">Go to site</a>
    </div>

    <script src="../../../0. Shared/config.js"></script>
    <script>
        const params = new URLSearchParams(window.location.search);
        const token = params.get('token');
        const statusEl = document.getElementById('status-message');

        if (!token) {
            statusEl.textContent = 'Missing verification token.';
            statusEl.className = 'error';
        } else {
            fetch(`${APP_API_BASE}/api/auth/verify-email?token=${encodeURIComponent(token)}`)
                .then(res => res.json().then(data => ({ ok: res.ok, data })))
                .then(({ ok, data }) => {
                    statusEl.textContent = data.message || data.error;
                    statusEl.className = ok ? 'success' : 'error';
                })
                .catch(() => {
                    statusEl.textContent = 'Something went wrong. Please try again later.';
                    statusEl.className = 'error';
                });
        }
    </script>
</body>
</html>
