<!-- cs1_index.html -->

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="cs1_index_style.css">
    <link rel="stylesheet" href="testing-engine.css">
    <link rel="stylesheet" href="../../../0. Shared/auth.css">
    <link rel="icon" type="image/png" href="../../../0. images/Code 100.png">
    <link rel="stylesheet" href="../../../0. Shared/fontawesome/css/all.min.css">
    <!-- GridStack.js：Cribsheet Builder 的拖拽网格画布用 -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/gridstack@10.1.2/dist/gridstack.min.css">
    <script src="https://cdn.jsdelivr.net/npm/gridstack@10.1.2/dist/gridstack-all.js"></script>
</head>
<body>
    <div id="header-wrapper">
        <div class="title-row">
            <img id="logo" src="../../../0. images/Code 100.png">
            <a id="web-header" href="../../../1. Home Page/home_page.html">
                <h1>CSCI-1100</h1>
            </a>
        </div>
        <a href="../../../1. Home Page/home_page.html" class="back-home-link">
            <span class="back-home-arrow">&larr;</span> Back to Home
        </a>
    </div>




    <div class="nav-bar">

        <a href="#" class="bar-items active" id="test1">Test 1</a>
        <a href="#" class="bar-items" id="test2">Test 2</a>
        <a href="#" class="bar-items" id="test3">Test 3</a>
        <a href="#" class="bar-items" id="final">Final Test</a>
    </div>

    

    <!-- 主要内容 -->
    <div class="main-layout">
        <!-- 板块切换器。同一时间只显示当前板块的名字，左右两个箭头切换。
             三个标签都留在 DOM 里，非当前的被移到两侧之外并透明化——
             切换时它们横向滑过，旧的滑出、新的滑入，不会出现文字瞬间被替换的生硬感。
             轨道宽度按最长的那个标签（Examination）固定，
             否则切换时整个组件的宽度会跟着抖。 -->
        <div class="section-switcher" id="section-switcher" role="tablist"
             aria-label="Switch section">

            <div class="switcher-track" id="switcher-track">
                <!-- 文字放在 data-* 上而不是直接写在标签里：
                     侧项只显示首字母，靠 CSS 伪元素在全称和首字母之间切换。
                     直接写文本再用 CSS 截字符是做不到的。
                     <span class="switcher-sr"> 留给读屏软件，它读到的始终是全称 -->
                <a href="#" class="switcher-item active" id="practice" role="tab" aria-selected="true"
                   data-label="Practice" data-initial="P"><span class="switcher-sr">Practice</span></a>
                <a href="#" class="switcher-item" id="testing" role="tab" aria-selected="false"
                   data-label="Examination" data-initial="E"><span class="switcher-sr">Examination</span></a>
                <a href="#" class="switcher-item" id="revision" role="tab" aria-selected="false"
                   data-label="Revision" data-initial="R"><span class="switcher-sr">Revision</span></a>
            </div>
        </div>

        <div class="content" id="content-container">
            <!-- 页面刚打开时，这里手动放 Test 1 的内容，避免第一次加载时空白 -->
        </div>
    </div>
    



    <!-- 沉浸模式开关。放在 body 直属层、用 fixed 定位——
         沉浸模式会把页头、导航栏、板块切换器、页脚全部收起，
         这个按钮必须留在外面，否则进去了就出不来。
         它【任何时候都可见】，不用 hidden 属性——上一版那个恢复按钮
         带了 hidden 却又写了 display: inline-flex，作者样式盖过 hidden，
         结果它一直占着一块空位只是看不见 -->
    <button type="button" class="immersive-toggle" id="immersive-toggle"
            aria-label="Toggle immersive mode" aria-pressed="false" title="Immersive mode">
        <i class="fa-solid fa-expand"></i>
    </button>

    <!-- 题目导航条：细长的分段竖条，固定悬浮在右侧垂直居中，
         一段一道题，鼠标移上去展开显示题号。
         段由 testing-engine.js 的 buildQuestionNav() 填进来——
         题号是动态的（每张卷子题目数不一样），写不死在这里。

         ⚠️ 必须放在 body 直属层，【不能】放进 skeleton.html 的
         #testing-content 里。那两层容器（#testing-content 和
         #content-container）在切板块的过渡里被写过 transform，
         动画停下后计算值是 matrix(1,0,0,1,0,0)——一个"零位移的 transform"。
         视觉上等于什么都没做，但对 position: fixed 来说照样建立包含块，
         导航条会变成相对那个容器定位、跟着页面内容一起滚。
         这个坑不显眼：DevTools 里那个 transform 值看起来就是"没动"。

         代价是它不会随 .test-section 自动隐藏，
         所以切板块时由 cs1_index.js 显式调 destroyQuestionNav()。

         ⚠️ 位置要避开上面那个沉浸模式按钮（top: 14px, right: 18px）：
         那个按钮任何时候都得能点到，所以这条导航垂直居中、z-index 也压它一层。

         hidden 由 JS 控制：开考前题目容器是隐藏的，
         那时候挂个跳转导航出来，点了什么都不会发生 -->
    <nav class="exam-question-nav" id="exam-question-nav"
         aria-label="Jump to question" hidden></nav>

    <!-- footer -->
    <div id="footer-container"></div>

    <!-- 登录 / 注册 / 忘记密码 弹窗（共用片段，见 cs1_index.js 里的 fetch） -->
    <div id="auth-modal-container"></div>

    <script src="../../../0. Shared/config.js"></script>
    <!-- 判分引擎（Pyodide）。必须在 testing-engine.js 【之前】加载，
         因为后者会调用它导出的 gradeQuestion。
         Pyodide 本体不在这里下载——那有 3~4MB，
         grading-engine.js 会在交卷时才按需去拉 -->
    <script src="grading-engine.js"></script>
    <script src="testing-engine.js"></script>
    <script src="cribsheet-builder.js"></script> 
    <script src="cs1_index.js"></script>
    <script src="../../../0. Shared/auth.js"></script>
</body>
</html>
