<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Code 100</title>
    <!-- Cloudflare Pages 对不存在的路径会用这个 404 页面。用【绝对路径】跳回首页——
         绝不能用相对路径:相对路径会在错误的深层 URL 上再叠加一层,越跳越深。 -->
    <meta http-equiv="refresh" content="0; url=/1.%20Home%20Page/home_page.html">
    <script>
        window.location.replace("/1.%20Home%20Page/home_page.html");
    </script>
</head>
<body>
    <p>Page not found. Redirecting to <a href="/1.%20Home%20Page/home_page.html">Code 100</a>…</p>
</body>
</html>
